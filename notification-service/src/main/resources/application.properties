spring.application.name=notification-service

server.port=8087

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_notification_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JWT (spec 5.4) ---
# Only the admin endpoints need a token, but they are validated here as well rather than
# trusting the gateway's X-User-* headers (defence in depth, D-035).
metashop.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.jwt.issuer=metashop-auth-service

# --- Kafka (spec 14) ---
# One consumer group for the whole service, so the four topics share one partition assignment
# and offsets. auto-offset-reset=earliest means a fresh group replays from the start of the
# retained log, which is what makes a new environment show the emails it "missed".
#
# The deserializers are wrapped in ErrorHandlingDeserializer on purpose. Without it a single
# unparseable record makes the container throw a RecordDeserializationException on every poll and
# stall the whole listener for ever; wrapped, the record surfaces with a null value and an exception
# header, which the error handler can dead-letter. That was found the hard way, by publishing a
# broken record to the dev broker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# The payload varies per eventType, so the envelope is the only fixed type; the payload is
# kept as a JsonNode and mapped to a typed record per event type (see NotificationPlanner).
# Type headers are ignored on purpose: the producer's class name is not this service's
# business, and a renamed DTO upstream must not break consumption (spec 14.4 versioning).
spring.kafka.consumer.properties.spring.json.value.default.type=com.shopMeta.notification_service.event.EventEnvelope
spring.kafka.consumer.properties.spring.json.trusted.packages=com.shopMeta.notification_service.event,com.shopMeta.notification_service.event.payload
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Manual commit after successful processing (spec 14.4): an event is only acknowledged once
# its notification has been persisted as SENT.
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Email (spec 13) ---
# Mailpit in dev (docker-compose.infra.yml): SMTP 1025, inbox at http://localhost:8025.
# Prod swaps in Gmail/SendGrid through the same two env vars.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Without a socket timeout a wedged SMTP server would block a consumer thread for ever.
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# --- Notification rules ---
metashop.notification.from-address=${MAIL_FROM:no-reply@metashop.com}
metashop.notification.from-name=MetaShop
# Low-stock alerts have no owning user, so they go to the platform operators.
metashop.notification.admin-email=${NOTIFICATION_ADMIN_EMAIL:admin@metashop.com}
# Links inside the emails point at the Angular app, not at this service.
metashop.notification.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
metashop.notification.max-page-size=100
# Dead letters land on <source-topic>.DLT (spec 14.1 / 14.4).
metashop.notification.dlt-suffix=.DLT
# Retry policy for a failed event: three attempts with a doubling delay, then the dead-letter topic.
metashop.notification.retry-max-attempts=3
metashop.notification.retry-initial-interval=1s
metashop.notification.retry-multiplier=2.0
metashop.notification.retry-max-interval=10s

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
