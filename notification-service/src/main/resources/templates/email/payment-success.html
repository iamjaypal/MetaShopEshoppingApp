<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment received</title>
    <th:block th:replace="~{email/fragments :: styles}"></th:block>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{email/fragments :: header}"></div>

    <div class="card">
        <p><span class="status status-ok">Paid</span></p>

        <h1>Payment received</h1>

        <p>Hi <span th:text="${greetingName}">there</span>, we have received your payment. This is your
            receipt.</p>

        <div class="panel">
            <p class="muted">Amount</p>
            <p class="total" th:text="${amount}">&#8377;0.00</p>
            <p class="muted">Paid with</p>
            <p th:text="${method}">Card</p>
            <p class="muted">Order</p>
            <p th:text="${orderId}">1</p>
            <p class="muted">Payment reference</p>
            <p th:text="${paymentId}">1</p>
        </div>

        <p>
            <a class="btn" th:href="${orderUrl}">View your order</a>
        </p>
    </div>

    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
