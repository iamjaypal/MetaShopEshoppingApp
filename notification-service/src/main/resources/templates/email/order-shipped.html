<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order shipped</title>
    <th:block th:replace="~{email/fragments :: styles}"></th:block>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{email/fragments :: header}"></div>

    <div class="card">
        <p><span class="status status-ok">On its way</span></p>

        <h1>Order <span th:text="${orderNumber}">MS-000000</span> has shipped</h1>

        <p>Hi <span th:text="${greetingName}">there</span>, your parcel has left our warehouse and is
            on its way to the address on the order.</p>

        <p>
            <a class="btn" th:href="${orderUrl}">Track your order</a>
        </p>
    </div>

    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
