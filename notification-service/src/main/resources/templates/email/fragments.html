<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MetaShop</title>
</head>
<body>

<!--
  The shared visual language for every MetaShop email. Fragments rather than a layout dialect: the
  templates stay plain HTML that a designer can open in a browser, and there is no extra dependency.

  Email clients are primitive, so the CSS sticks to widely supported properties and the layout is
  block-based rather than flex/grid. A plain-text alternative is not generated — spec 13 asks for
  Thymeleaf HTML templates, and Mailpit/the dev flow only reads the HTML part.
-->

<th:block th:fragment="styles">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f5f7;
            color: #1f2933;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e4e7eb;
            border-radius: 8px;
            padding: 32px;
        }

        .brand {
            margin: 0 0 20px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand span {
            color: #2f6fed;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 22px;
            line-height: 1.3;
        }

        p {
            margin: 0 0 16px;
            font-size: 15px;
            line-height: 1.6;
        }

        .muted {
            color: #6b7280;
            font-size: 13px;
        }

        .panel {
            margin: 0 0 20px;
            padding: 16px;
            background: #f9fafb;
            border: 1px solid #e4e7eb;
            border-radius: 6px;
        }

        .panel p:last-child {
            margin-bottom: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            padding: 8px 0;
            border-bottom: 1px solid #e4e7eb;
            color: #6b7280;
            font-weight: 600;
            text-align: left;
        }

        th.right, td.right {
            text-align: right;
        }

        td {
            padding: 8px 0;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: top;
        }

        .total {
            font-size: 16px;
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2f6fed;
            border-radius: 6px;
            color: #ffffff !important;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .status-ok {
            background: #e6f4ea;
            color: #1e7a3c;
        }

        .status-warn {
            background: #fef3c7;
            color: #92600a;
        }

        .status-bad {
            background: #fde8e8;
            color: #b42318;
        }

        .divider {
            height: 1px;
            margin: 24px 0;
            background: #e4e7eb;
        }
    </style>
</th:block>

<div th:fragment="header">
    <p class="brand">Meta<span>Shop</span></p>
</div>

<div th:fragment="footer">
    <div class="divider"></div>
    <p class="muted">You are receiving this because you have a MetaShop account.</p>
    <p class="muted">MetaShop &middot; This is an automated message, please do not reply.</p>
</div>

</body>
</html>
