<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to MetaShop</title>
    <th:block th:replace="~{email/fragments :: styles}"></th:block>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{email/fragments :: header}"></div>

    <div class="card">
        <h1 th:text="|Welcome aboard, ${firstName}!|">Welcome aboard, there!</h1>

        <p>Your MetaShop account is ready. Browse the catalogue, add what you like to your cart and
            check out in a couple of clicks.</p>

        <p>
            <a class="btn" th:href="${shopUrl}">Start shopping</a>
        </p>

        <div class="divider"></div>

        <p class="muted">You are receiving this because an account was created for
            <span th:text="${email}">you@example.com</span>.</p>
    </div>

    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
