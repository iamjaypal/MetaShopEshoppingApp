spring.application.name=inventory-service

server.port=8083

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_inventory_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JWT (spec 5.4) ---
# Downstream services validate the token themselves (defence in depth), using the same
# secret as auth-service. The gateway's X-User-* headers are only a convenience.
metashop.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.jwt.issuer=metashop-auth-service

# --- Internal service-to-service calls (spec 5.4 / 18) ---
# Every /api/v1/internal/** request must carry X-Internal-Token with this value.
metashop.internal.token=${INTERNAL_TOKEN:MetaShopDevOnlyInternalTokenChangeMe0123456789}

# --- Stock rules (spec 9) ---
# Default threshold when a stock row is created without one.
metashop.inventory.default-low-stock-threshold=5
# A RESERVED reservation that is not confirmed/released within this window expires (spec 9.4).
metashop.inventory.reservation-ttl=15m
# How often the expiry sweeper runs.
metashop.inventory.sweep-interval=60s
# The public availability endpoint never reports more than this many units, so exact stock
# levels cannot be scraped ("only 3 left" rather than "312 left", spec 9.3).
metashop.inventory.display-quantity-cap=10

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
