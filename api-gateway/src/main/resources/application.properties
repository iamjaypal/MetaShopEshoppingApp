spring.application.name=api-gateway

# The Gateway is the single public entry point (spec 3.1 / 6.2)
server.port=8080

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- JWT validation (spec 5.4). Secret MUST match auth-service. ---
metashop.gateway.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.gateway.jwt.issuer=metashop-auth-service

# --- CORS: only the Angular app (spec 18) ---
metashop.gateway.cors.allowed-origins[0]=${ANGULAR_ORIGIN:http://localhost:4200}

# --- Rate limiting of credential endpoints (spec 6.2 / 18) ---
metashop.gateway.rate-limit.enabled=true
metashop.gateway.rate-limit.requests-per-window=5
metashop.gateway.rate-limit.window-seconds=60

# --- Downstream HTTP client ---
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
# The gateway endpoint is read-only: it can list routes but cannot add/remove them at runtime.
management.endpoint.gateway.access=read-only

logging.level.com.shopMeta.api_gateway=INFO
