spring.application.name=cart-service

server.port=8084

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_cart_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JWT (spec 5.4) ---
# The cart is always user-scoped: the owner comes from the token subject. The secret and
# issuer must match auth-service exactly (defence in depth; the gateway already validated it).
metashop.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.jwt.issuer=metashop-auth-service

# --- Internal service-to-service calls (spec 5.4 / 18) ---
# Sent as X-Internal-Token on every outbound Feign call and required on /api/v1/internal/cart/**.
metashop.internal.token=${INTERNAL_TOKEN:MetaShopDevOnlyInternalTokenChangeMe0123456789}

# --- Cart rules (spec 10.1) ---
# Max quantity of one product in a cart; mirrors the CHECK constraint in V1__init.sql.
metashop.cart.max-quantity-per-item=20
# Max number of different products in one cart (keeps the downstream batch calls small).
metashop.cart.max-distinct-items=50

# --- Downstream calls: product-service / inventory-service (spec 5.8) ---
# Feign resolves the service names through Eureka (LoadBalancer). The timeout lives here —
# Resilience4j's TimeLimiter only applies to reactive calls and this service is blocking MVC.
# The retry + circuit-breaker policies are built programmatically in ResilienceConfig from
# the metashop.resilience.* values below.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
metashop.resilience.retry-max-attempts=3
metashop.resilience.retry-wait-duration=200ms
metashop.resilience.retry-backoff-multiplier=2.0
metashop.resilience.sliding-window-size=10
metashop.resilience.minimum-number-of-calls=5
metashop.resilience.failure-rate-threshold=50
metashop.resilience.wait-duration-in-open-state=15s
metashop.resilience.permitted-number-of-calls-in-half-open-state=3

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
