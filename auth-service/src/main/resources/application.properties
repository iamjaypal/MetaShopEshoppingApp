spring.application.name=auth-service

server.port=8081

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_auth_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JWT (spec 7.4) ---
# The secret must be >= 256 bit. Override with the JWT_SECRET env var in every real
# environment; the default below is for local dev only.
metashop.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.jwt.issuer=metashop-auth-service
metashop.jwt.access-token-ttl=15m
metashop.jwt.refresh-token-ttl=7d

# --- Account lockout (spec 7.4) ---
metashop.security.max-failed-login-attempts=5
metashop.security.lock-duration=15m

# --- Password reset ---
metashop.security.password-reset-ttl=30m

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Seed data (spec 7.2 / 20) ---
# Demo accounts are only created outside the prod profile. Override the passwords with
# the ADMIN_PASSWORD / CUSTOMER_PASSWORD env vars.
metashop.seed.enabled=true
metashop.seed.admin.email=admin@metashop.com
metashop.seed.admin.password=${ADMIN_PASSWORD:Admin@12345}
metashop.seed.customer.email=customer@metashop.com
metashop.seed.customer.password=${CUSTOMER_PASSWORD:Customer@12345}
