spring.application.name=order-service

server.port=8085

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_order_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- JWT (spec 5.4) ---
# Same secret/issuer as auth-service (defence in depth). The caller's token is also FORWARDED to
# cart-service for the checkout reads (GET /api/v1/cart, POST /api/v1/cart/validate, D-061).
metashop.jwt.secret=${JWT_SECRET:MetaShopDevOnlyJwtSecretKeyChangeMe0123456789abcdef}
metashop.jwt.issuer=metashop-auth-service

# --- Internal service-to-service calls (spec 5.4 / 18) ---
# Sent as X-Internal-Token on every internal downstream call; required on /api/v1/internal/orders/**.
metashop.internal.token=${INTERNAL_TOKEN:MetaShopDevOnlyInternalTokenChangeMe0123456789}

# --- Order rules (spec 11) ---
# Flat shipping fee added to the subtotal; free when the subtotal reaches the threshold.
metashop.order.shipping-fee=49
metashop.order.free-shipping-threshold=499

# --- Downstream calls (spec 5.8) ---
# Feign resolves the service names through Eureka (LoadBalancer). The timeout lives here —
# Resilience4j's TimeLimiter only applies to reactive calls and this service is blocking MVC.
# The retry + circuit-breaker policies are built programmatically in ResilienceConfig.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
metashop.resilience.retry-max-attempts=3
metashop.resilience.retry-wait-duration=200ms
metashop.resilience.retry-backoff-multiplier=2.0
metashop.resilience.sliding-window-size=10
metashop.resilience.minimum-number-of-calls=5
metashop.resilience.failure-rate-threshold=50
metashop.resilience.wait-duration-in-open-state=15s
metashop.resilience.permitted-number-of-calls-in-half-open-state=3

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
