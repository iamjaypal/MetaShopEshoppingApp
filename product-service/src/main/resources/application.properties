spring.application.name=product-service

server.port=8082

# --- Service discovery (spec 6.1) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Datasource (dev defaults; overridden by env vars in later phases) ---
spring.datasource.url=jdbc:mysql://localhost:3306/metashop_product_db
spring.datasource.username=root
spring.datasource.password=root123

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Multipart uploads (product images) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Local file storage for product images ---
metashop.storage.location=uploads
metashop.storage.public-base-url=/uploads

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
